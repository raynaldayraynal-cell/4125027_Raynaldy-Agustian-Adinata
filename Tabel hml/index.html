<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="table-container">
        <h2>Daftar Nilai Mahasiswa</h2>

                </tr>

                    <th>No</th>
                    <th>Nama</th>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Andi</td>

                </tr>
                <tr>
                    <td>2</td>
                    <td>Budi</td>
                </tr>
            </tbody>
        </table>
    </div>
