<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Media - Video & Audio</title>
    <!-- Menghubungkan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="media-container">
        <h2>Pemutar Media</h2>
        <p class="media-subtitle">Nikmati video Kegiatan Saya dan putar lagu favorit Anda di sini.</p>

        <!-- Bagian Video -->
        <div class="media-section">
            <h3>Video Kegiatan Saya</h3>
            <div class="video-wrapper">
                <video controls>
                    <source src="vidio kegiatan.mp4" type="video/mp4">
                    Browser Anda tidak mendukung tag video.
                </video>
            </div>
        </div>

        <!-- Bagian Audio -->
        <div class="media-section">
            <h3>Pemutar Musik</h3>
            <div class="audio-wrapper">
                <audio controls>
                    <source src="lagu.mpeg" type="audio/mpeg">
                    Browser Anda tidak mendukung tag audio.
                </audio>
            </div>
        </div>
    </div>

</body>
</html>
